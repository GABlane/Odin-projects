<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Odin Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box1">
        <div class="img-container">
            <img src="./Img/Background.jpg" alt="this is image" class="bg-img">
            <div id="banner-text">
                <img src="./Img/odin-lined.png" alt="ODIN" class="logo">
                <span class="title">ODIN</span>
            </div>
        </div>
    </div>
    <div class="box2">
        <h3>This is not a real online service! You know you need something like this in your life to help you realize
            your deepest dreams. Sign up now to get started.</h3>
        <br>
        <h3>You know you want to.</h3>

        <h3>Lets do this!</h3>
        <div id="input">
            <div class="input-boxes">
                <fieldset>
                    <legend> <label for="first-name">First Name</label></legend>
                    <input type="text">
                </fieldset>
            </div>
            <div class="input-boxes">
                <fieldset>
                    <legend> <label for="last-name">Last Name</label></legend>
                    <input type="text">
                </fieldset>
            </div>
            <div class="input-boxes">
                <fieldset>
                    <legend> <label for="email">Email</label></legend>
                    <input type="text">
                </fieldset>
            </div>
            <div class="input-boxes">

                <fieldset>
                    <legend> <label for="number">number</label></legend>
                    <input type="text">
                </fieldset>
            </div>
            <div class="input-boxes">

                <fieldset>
                    <legend> <label for="password">Password</label></legend>
                    <input type="text">
                </fieldset>
            </div>
            <div class="input-boxes">

                <fieldset>
                    <legend> <label for="confirmation">Confirm Password</label></legend>
                    <input type="text">
                </fieldset>
            </div>
        </div>
    </div>
</body>

</html>
